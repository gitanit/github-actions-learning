name: Update YAML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Change YAML
        run: |
          sed -i 's/version: 1/version: 2/' config.yml

      - name: Show changed file
        run: |
          cat config.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.yml
          git commit -m "Update config version" || echo "No changes to commit"
          git push
